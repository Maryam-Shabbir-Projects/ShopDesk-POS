name: shopdesk
description: Inventory and point of sale app for small shops.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.1
  http: ^1.2.1
  crypto: ^3.0.3
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
dependency_overrides:
  image: 4.11.0
  archive: 4.5.2